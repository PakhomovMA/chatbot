global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml
scrape_configs:
  - job_name: chatbot
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    sample_limit: 12000
    static_configs:
      - targets: ['host.docker.internal:8081']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  # The trace pipeline, when the `llm` profile is running. It is optional by design, so nothing
  # alerts on this target being absent; the alerts below fire on what a running collector reports —
  # a queue near its capacity, refused spans, failed exports (docs/observability-plan.md §8.3).
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
