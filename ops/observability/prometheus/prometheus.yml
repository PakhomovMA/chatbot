global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml
scrape_configs:
  - job_name: chatbot
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    sample_limit: 12000
    static_configs:
      - targets: ['host.docker.internal:8081']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
