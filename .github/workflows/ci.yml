name: build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Frontend tests run the TypeScript sources through Node type stripping (23.6+).
      - uses: actions/setup-node@v4
        with:
          node-version: '23'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew clean build
