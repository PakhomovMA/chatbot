spring:
  application:
    name: chatbot
  lifecycle:
    # Upper bound for one shutdown phase; the ordered stop of background work (C08) fits inside it
    # with 25 s, and the graceful drain below gets its own phase.
    timeout-per-shutdown-phase: 30s

# Local-first: bind to loopback only (docs/system-plan.md D13).
server:
  address: 127.0.0.1
  port: 8080
  # Stop accepting requests and let the ones in flight finish instead of cutting them off
  # (docs/concurrency-plan.md C08). Chat requests are cancelled and event streams closed before this
  # drain starts, so an open browser tab does not hold the shutdown for the whole timeout.
  shutdown: graceful

chatbot:
  # Root for Lucene index, document registry, uploaded originals and model files (§9).
  data-dir: ${user.home}/.chatbot
  embedding:
    # onnx = in-process EmbeddingGemma (default), ollama = fallback via a running Ollama (D3).
    provider: onnx
    batch-size: 16
    max-concurrent-batches: 2
    normalize: true
    onnx:
      model-dir: ${chatbot.data-dir}/models/embeddinggemma-300m
      model-file: model.onnx
      tokenizer-file: tokenizer.json
      model-name: embeddinggemma-300m
      max-tokens: 2048
      intra-op-threads: 0   # 0 = min(4, cores)
      dimensions: 768
    ollama:
      base-url: http://localhost:11434
      model: embeddinggemma:300m

  knowledge:
    max-upload-size: 20MB
    allowed-extensions: [md, markdown, txt, html, htm, pdf, docx]
  index:
    dir: ${chatbot.data-dir}/index      # lucene/ + manifest.json
    in-memory: false
    max-chunk-size: 800                  # characters; calibrated on the eval set (docs/eval-log.md); part of the index manifest
    overlap-size: 100
    embedding-batch-size: 32
  ingestion:
    auto-resume: true                    # queue pending documents at startup
    retry-interrupted: true              # re-queue documents interrupted by a crash
  retrieval:
    top-k: 8
    candidate-multiplier: 3              # candidates per facet = top-k * multiplier
    rrf-k: 60
    min-cosine: 0.0                      # vector noise floor (plain cosine)
    min-text-score: 0.0                  # BM25 is corpus-relative: rank only
    sufficient-cosine: 0.3               # calibrated on the eval set (docs/eval-log.md): negatives max 0.22, positives min 0.32
    expand-neighbours: 0                 # section chunks shown on each side of every hit (0 = off); also the agentic search tools
    trace-buffer-size: 200
  chat:
    mode: DETERMINISTIC                  # or AGENTIC: the model searches via Embabel ToolishRag tools (Phase 9c)
    answer-language: AUTO                # AUTO = language of the question (RU detected by script); RU or EN force it
    agentic-max-searches: 4
    agentic-min-cosine: 0.2
    temperature: 0.1
    evidence-char-budget: 6000           # evidence passages shown to the model (§6.7)
    quote-max-chars: 600
    history-turns: 10                    # in-memory conversation memory (D12)
    max-conversations: 1000
    conversation-ttl: 24h
    expand-search:
      # Second retrieval pass when the first one stays under sufficient-cosine (Phase 9a):
      # NONE | NEIGHBOURS (wider reading window) | REWRITE (the model rephrases) | HYDE (the model
      # writes the passage it expects). REWRITE measured best; NONE removes the extra model call on
      # questions the corpus cannot answer (docs/eval-log.md).
      strategy: REWRITE
      queries: 3                         # rewrites asked for (REWRITE only)
    decompose:
      # A question that asks for several things is split into its parts and each part is searched for
      # on its own; the passes are merged by rank (Phase 9d). Costs one model call and a search per
      # part, on questions whose wording says they ask for more than one thing. Off by default: on this
      # corpus one query already returns every part's passages inside the evidence budget, so the split
      # only reordered them (docs/eval-log.md). Switch on where the parts compete for the budget.
      enabled: false
      max-sub-questions: 3
      max-concurrent-searches: 4
    compare-sources:
      # When the question asks how things relate and the passages shown to the model come from several
      # documents, the sources are compared before the answer is drafted (Phase 9d): one model call,
      # and the answer names both sides instead of following the top passage. Off by default: it costs
      # a local 14B model several times the answer latency, and this corpus has no two documents that
      # disagree (docs/eval-log.md). Switch on for overlapping, contradictory documentation.
      enabled: false
      min-documents: 2
      max-aspects: 4
    section-tools:
      # Table-of-contents tools for the agentic branch (Phase 9c follow-up): listSections shows the
      # documents and their sections, readSection reads one section whole and in order, so a table or
      # a list of steps arrives complete instead of as the chunks a search ranked. Embabel builds them
      # from its SectionReader interface; they add no model call, only two more tools to choose from.
      # Off gives the model exactly the four search tools of Phase 9c.
      enabled: true
      read-char-budget: 6000             # a section read at once; Embabel's own default is 25000
  sse:
    # Events a server-sent-events connection may fall behind by before it is dropped and the work
    # behind it cancelled; each connection is written by a sender of its own, so a slow reader
    # delays nobody else (docs/concurrency-plan.md C06).
    buffer-size: 256

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 25MB

spring.mvc.problemdetails.enabled: true
spring.jackson.default-property-inclusion: non_null

embabel:
  models:
    # Ollama models are registered under their raw Ollama name (§1.3 p.7).
    default-llm: qwen3:14b
  agent:
    platform:
      models:
        ollama:
          base-url: http://localhost:11434

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  # Embabel tracing is wired but off by default; enable with SPRING_PROFILES_ACTIVE=observability.

# One createObject() call wraps the whole tool loop in agentic mode (two model turns + searches); with a
# local 14B model a long answer alone takes ~1 min, so the Embabel default (60 s, then 10 full retries)
# turned every such request into a 10-minute retry storm. The loop is bounded by agentic-max-searches.
embabel.agent.platform.llm-operations:
  prompts:
    default-timeout: 10m
  data-binding:
    max-attempts: 2

embabel.agent.platform.observability:
  tracing-enabled: false
  metrics-enabled: true

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr([%t]){magenta} %clr(%-5level) %clr(%logger{0}){cyan} %clr(-){faint} %clr(%X{requestId} %X{conversationId} %X{messageId} %X{documentId}){faint} %msg%n"
  level:
    com.embabel: INFO
