# "hermetic" test profile: no Ollama, no model files. (Not named "test": Embabel skips @Agent registration under a profile called "test".) LLM access is mocked by EmbabelMockitoIntegrationTest,
# embeddings come from FakeEmbeddingConfiguration (provider "fake" creates no main-code bean).
chatbot:
  data-dir: ${java.io.tmpdir}/chatbot-test
  embedding:
    provider: fake
  index:
    in-memory: true
  chat:
    # Tests choose the answer mode per request; the default must not follow the developer's application.yaml.
    mode: DETERMINISTIC
  cache:
    # Every result cache off, whatever application.yaml ships: tests repeat questions on purpose, and a
    # cached answer would hide the run they are about. A test of a cache switches its layer on itself.
    answer:
      enabled: false
    derivation:
      enabled: false
    semantic:
      mode: "OFF"

embabel:
  agent:
    platform:
      models:
        ollama:
          # Empty base-url => Embabel skips Ollama model discovery entirely (OllamaModelsConfig).
          base-url: ""

server:
  port: 0
embabel.agent.platform.observability:
  tracing-enabled: false

# An action that throws is retried by the platform (ActionQos: 5 attempts, 10 s backoff × 5, capped at
# 60 s), which is what a flaky model deserves and a mock never does: a stub that throws throws again on
# every attempt, so the only thing the retries add is three minutes of sleeping. One attempt per action
# keeps a test that asserts a failure — a truncated JSON reply, an unreachable model — as fast as one
# that asserts an answer.
embabel.agent.platform.action-qos.default:
  max-attempts: 1
