plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.personal'
version = '0.0.1-SNAPSHOT'
description = 'chatbot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    // Verified against Maven Central POMs (see docs/system-plan.md §1.2):
    // Embabel 1.5.1 is built on Spring Boot 4.1.0 / Spring AI 2.0.0 / Lucene 9.11.1.
    embabelVersion = '1.5.1'
    // Same versions Embabel's own ONNX module pins; used by the custom EmbeddingService (Phase 1).
    onnxRuntimeVersion = '1.22.0'
    djlTokenizersVersion = '0.32.0'
}

dependencies {
    implementation platform("com.embabel.agent:embabel-agent-dependencies:${embabelVersion}")

    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Tracing of agent/action/LLM/tool/RAG spans (Embabel) with an OTLP-ready OpenTelemetry SDK; only
    // exported under the "observability" profile (see LoggingSpanExporterConfiguration).
    implementation 'com.embabel.agent:embabel-agent-starter-observability'
    implementation 'io.opentelemetry:opentelemetry-exporter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Embabel: platform, Ollama models, Lucene RAG store, Tika parsing.
    // Deliberately NOT embabel-agent-starter-onnx: it downloads MiniLM and is incompatible with EmbeddingGemma.
    implementation 'com.embabel.agent:embabel-agent-starter'
    implementation 'com.embabel.agent:embabel-agent-starter-ollama'
    implementation 'com.embabel.agent:embabel-agent-rag-lucene'
    implementation 'com.embabel.agent:embabel-agent-rag-tika'

    // In-process embeddings (EmbeddingGemma ONNX)
    implementation "com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}"
    implementation "ai.djl.huggingface:tokenizers:${djlTokenizersVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.embabel.agent:embabel-agent-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// JDK 24+ (JEP 472) warns on JNI native access from the unnamed module (ONNX Runtime, DJL tokenizers).
def nativeAccessJvmArgs = ['--enable-native-access=ALL-UNNAMED']

// Test tiers (docs/system-plan.md §11). Default `test` runs only tests that need neither
// model files nor a running Ollama. Include a tier with: ./gradlew test -PincludeTags=model,e2e
// The e2e tier runs on the LLM from application.yaml; -Pe2e.llm=<ollama model> points it at another
// one, which is how two local models are compared on the same golden questions.
tasks.named('test') {
    useJUnitPlatform {
        if (project.hasProperty('includeTags')) {
            includeTags project.property('includeTags').split(',')
        } else {
            excludeTags 'model', 'eval', 'e2e', 'ui'
        }
    }
    jvmArgs nativeAccessJvmArgs
    if (project.hasProperty('e2e.llm')) {
        systemProperty 'e2e.llm', project.property('e2e.llm')
        outputs.upToDateWhen { false }
    }
    // A model-backed run is minutes long and silent by default, so a hang looks exactly like work.
    // -Pe2e.verbose streams the application log while the tests run.
    if (project.hasProperty('e2e.verbose')) {
        testLogging { showStandardStreams = true }
    }
}

tasks.named('bootRun') {
    jvmArgs nativeAccessJvmArgs
}

// Retrieval quality gate over the golden set (docs/system-plan.md §11). Needs the local ONNX model files.
// The expandSearch comparison (Phase 9a) also uses Ollama when it is running; without it, only the
// strategies that need no model call are measured.
//   ./gradlew ragEval [-Peval.chunkSize=800 -Peval.overlap=100 -Peval.minRecall=0.8 -Peval.sufficientCosine=0.5]
//                     [-Peval.maxDocumentShare=0.6]
//                     [-Peval.llm=qwen3:14b -Peval.ollamaUrl=http://localhost:11434]
tasks.register('ragEval', Test) {
    description = 'Runs the RAG retrieval evaluation against the golden question set'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'eval' }
    jvmArgs nativeAccessJvmArgs
    outputs.upToDateWhen { false }
    ['eval.chunkSize', 'eval.overlap', 'eval.minRecall', 'eval.sufficientCosine', 'eval.maxDocumentShare',
     'eval.llm', 'eval.ollamaUrl'].each { key ->
        if (project.hasProperty(key)) {
            systemProperty key, project.property(key)
        }
    }
    testLogging { events 'passed', 'failed'; showStandardStreams = false }
}

// ---- Vue frontend (frontend/) -----------------------------------------------------------------
// Built with the local Node toolchain (Node 20+, and 23.6+ for `frontendTest`, which runs the
// TypeScript sources through Node's own type stripping; the Gradle node plugin predates Gradle 9).
// The production bundle is copied into the jar under static/. Skip with -PskipFrontend.
def frontendDir = file('frontend')
def frontendEnabled = !project.hasProperty('skipFrontend')
def windows = System.getProperty('os.name').toLowerCase().contains('windows')

// npm is looked up as an absolute path rather than left to the PATH of the process that runs it.
// A Gradle daemon started from a desktop launcher (IDEA on macOS) inherits the minimal environment
// of the GUI session — PATH=/usr/bin:/bin:/usr/sbin:/sbin — where no Homebrew, nvm or Volta install
// is visible, and the daemon is then reused for terminal builds too, since the environment is not
// part of daemon matching. Both would fail with "A problem occurred starting process 'command npm'".
// Override with -Pnpm=/path/to/npm when the toolchain lives somewhere this does not look.
def npmCandidates = {
    List<String> names = windows ? ['npm.cmd', 'npm.exe'] : ['npm']
    List<File> roots = []
    System.getenv('PATH')?.split(File.pathSeparator)?.each { roots << new File(it) }
    // Where the common installers put a toolchain the GUI environment cannot see.
    ['/opt/homebrew/bin', '/usr/local/bin', '/opt/local/bin'].each { roots << new File(it) }
    File home = new File(System.getProperty('user.home'))
    [new File(home, '.volta/bin'), new File(home, '.local/bin')].each { roots << it }
    // Version managers keep one bin per installed version; the newest that has npm wins.
    [new File(home, '.nvm/versions/node'), new File(home, 'Library/Application Support/fnm/node-versions')].each { base ->
        base.listFiles()?.sort { it.name }?.reverse()?.each { version ->
            roots << new File(version, 'bin')
            roots << new File(version, 'installation/bin') // fnm's layout
        }
    }
    roots.findResults { root -> names.findResult { name -> new File(root, name).with { it.isFile() ? it : null } } }
}

def npmExecutable
if (project.hasProperty('npm')) {
    npmExecutable = project.property('npm').toString()
} else {
    File found = npmCandidates().find()
    npmExecutable = found ? found.absolutePath : (windows ? 'npm.cmd' : 'npm')
}

// On Unix npm itself is a Node script (`#!/usr/bin/env node`), so an absolute path to it is not
// enough: the child process has to be able to find `node` as well. Its own directory goes in front
// of the inherited PATH, which also keeps npm and node from different installs from being mixed.
// Windows needs none of this — npm.cmd resolves node next to itself.
def npmBinDir = new File(npmExecutable).parentFile
def frontendPath = !windows && npmBinDir?.isDirectory()
        ? npmBinDir.absolutePath + File.pathSeparator + (System.getenv('PATH') ?: '')
        : null

def useNodeToolchain = { Exec task ->
    task.executable = npmExecutable
    if (frontendPath) {
        task.environment 'PATH', frontendPath
    }
}

tasks.register('frontendInstall', Exec) {
    description = 'Installs frontend dependencies (npm ci)'
    group = 'frontend'
    onlyIf { frontendEnabled }
    workingDir frontendDir
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    outputs.dir('frontend/node_modules')
    useNodeToolchain(it)
    args 'ci', '--no-audit', '--no-fund'
}

tasks.register('frontendBuild', Exec) {
    description = 'Type-checks and bundles the Vue app into frontend/dist'
    group = 'frontend'
    dependsOn 'frontendInstall'
    onlyIf { frontendEnabled }
    workingDir frontendDir
    inputs.dir('frontend/src')
    inputs.files('frontend/index.html', 'frontend/package.json', 'frontend/package-lock.json', 'frontend/tsconfig.json', 'frontend/vite.config.ts')
    outputs.dir('frontend/dist')
    useNodeToolchain(it)
    args 'run', 'build'
}

tasks.register('frontendTest', Exec) {
    description = 'Runs the frontend store/transport tests on the Node test runner'
    group = 'frontend'
    dependsOn 'frontendInstall'
    onlyIf { frontendEnabled }
    workingDir frontendDir
    inputs.dir('frontend/src')
    inputs.dir('frontend/test')
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    useNodeToolchain(it)
    args 'test', '--silent'
}

tasks.named('check') {
    dependsOn 'frontendTest'
}

tasks.named('processResources') {
    dependsOn 'frontendBuild'
    from(frontendDir.toPath().resolve('dist')) {
        into 'static'
    }
}

// O01 probe is deliberately outside the application jar and the default test/runtime classpaths.
// Its exporter changes only the destination; SDK/provider/handler selection stays auto-configured.
sourceSets {
    baseline {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    baselineImplementation.extendsFrom implementation
    baselineRuntimeOnly.extendsFrom runtimeOnly
}
tasks.named('check') {
    dependsOn tasks.named('baselineClasses')
}
dependencies {
    // Scrape the actual registry format before O04 enables Prometheus in the application.
    baselineImplementation 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
}
if (project.hasProperty('observabilityBaseline')) {
    tasks.named('bootRun') {
        dependsOn tasks.named('baselineClasses')
        classpath = sourceSets.baseline.runtimeClasspath
        mainClass = 'com.personal.chatbot.baseline.ObservabilityBaseline'
    }
}
tasks.register('observabilityDependencies') {
    description = 'Writes resolved production and probe dependency inventories as JSON'
    group = 'verification'
    doLast {
        def target = file(providers.gradleProperty('inventoryOutput').getOrElse('/tmp/chatbot-o01-dependencies.json'))
        def graph = [runtimeClasspath: configurations.runtimeClasspath,
                     baselineRuntimeClasspath: configurations.baselineRuntimeClasspath].collectEntries { name, config ->
            [(name): config.resolvedConfiguration.resolvedArtifacts.collect {
                [group: it.moduleVersion.id.group, name: it.name, version: it.moduleVersion.id.version,
                 sha256: java.security.MessageDigest.getInstance('SHA-256').digest(it.file.bytes).encodeHex().toString()]
            }.sort { a, b -> "${a.group}:${a.name}" <=> "${b.group}:${b.name}" }]
        }
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(graph)) + '\n'
    }
}

tasks.register('observabilityProviderTest', Test) {
    description = 'Reproduces Spring AI provider call/retry/tool/usage and Prometheus fixtures against a local HTTP stub'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.personal.chatbot.observability.ProviderObservationContractTest' }
    jvmArgs nativeAccessJvmArgs
    systemProperty 'o01.provider.output', providers.gradleProperty('providerOutput').getOrElse('/tmp/chatbot-o01-provider')
    outputs.upToDateWhen { false }
}
